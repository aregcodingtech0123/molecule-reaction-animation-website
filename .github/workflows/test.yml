name: tests

on:
  push:
    branches: [main]
  # `pull_request` (not `pull_request_target`): fork PRs run with a read-only token and no secrets.
  # This workflow references no secrets at all.
  pull_request:

# Least privilege for the GITHUB_TOKEN in every job: read the repository, nothing else.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable service container below — the db-guard only accepts local hosts and *test* names.
  TEST_DATABASE_URL: postgresql://postgres@localhost:5432/moleculestudio_test
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: "1"

# Third-party actions are pinned to full commit SHAs (tag in the comment), verified with
# `git ls-remote` against github.com/actions/* on 2026-10-25. All three run on node24.
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node      v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
#   actions/upload-artifact v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9

jobs:
  service:
    name: auth-billing-service (unit · api · db)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: services/auth-billing-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/auth-billing-service/package-lock.json
      - run: npm ci
      # Source and test files must type-check (vitest strips types without checking them).
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: service-coverage
          path: services/auth-billing-service/coverage

  web:
    name: web (unit · BFF api · next build)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/auth-billing-service/package-lock.json
      - run: npm ci
      # The BFF suite boots the real Express service in-process.
      - run: npm ci --prefix services/auth-billing-service
      - run: npm run typecheck:tests
      - run: npx vitest run --coverage
      # Production build: catches build failures and type errors anywhere in the tsconfig program
      # (Next.js 16.4 type-checks test files too). Needs no secrets: instrumentation skips during build.
      - run: npx next build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-coverage
          path: coverage

  lint:
    name: lint (non-blocking)
    runs-on: ubuntu-24.04
    # Reported, not enforced yet: 27 pre-existing React Compiler findings are listed in
    # docs/security/DEPENDENCY_TRIAGE.md for a separate decision.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Step-level too: with only the job-level flag the workflow stays green but this job's own check
      # can still show as failed on the PR. Here the job succeeds; the findings stay visible in this log.
      - run: npx eslint .
        continue-on-error: true

  e2e:
    name: e2e (Playwright, Chromium + mobile)
    needs: [service, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/auth-billing-service/package-lock.json
      - run: npm ci
      - run: npm ci --prefix services/auth-billing-service
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  e2e-production:
    # Same suite against `next build` + `next start` (Part 2B): the strict nonce CSP, HSTS, Secure cookies and the
    # production config checks only exist there. A separate job so it runs in parallel with `e2e`.
    name: e2e production build (Playwright, Chromium + mobile)
    needs: [service, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_NEXT_MODE: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/auth-billing-service/package-lock.json
      - run: npm ci
      - run: npm ci --prefix services/auth-billing-service
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-production
          path: |
            playwright-report
            test-results
