name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable service container below — the db-guard only accepts local hosts and *test* names.
  TEST_DATABASE_URL: postgresql://postgres@localhost:5432/moleculestudio_test
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  service:
    name: auth-billing-service (unit · api · db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: services/auth-billing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/auth-billing-service/package-lock.json
      - run: npm ci
      # Source and test files must type-check (vitest strips types without checking them).
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-coverage
          path: services/auth-billing-service/coverage

  web:
    name: web (unit · BFF api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/auth-billing-service/package-lock.json
      - run: npm ci
      # The BFF suite boots the real Express service in-process.
      - run: npm ci --prefix services/auth-billing-service
      - run: npm run typecheck:tests
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: coverage

  e2e:
    name: e2e (Playwright, Chromium + mobile)
    needs: [service, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine  # matches production (Neon, PostgreSQL 18.6)
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/auth-billing-service/package-lock.json
      - run: npm ci
      - run: npm ci --prefix services/auth-billing-service
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
