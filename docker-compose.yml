# =============================================================================
# Molecule Architecture Studio — local PostgreSQL (Docker)
# =============================================================================
# Isolated from production. Do NOT point production DATABASE_URL here.
# PostgreSQL 18 — the same major version as production (Neon, 18.6).
#
# Usage (from repo root):
#   docker compose up -d
#   cd services/auth-billing-service && npm run db:setup
#
# Upgrading from the earlier postgres:16 setup: this file uses a NEW volume
# (molecule_studio_postgres18_data); the old 16 volume (molecule_studio_postgres_data)
# is left untouched. See README → "Local Postgres 16 → 18".
# =============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: molecule_studio_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: molecule_studio_db
    volumes:
      # 18+ images keep data under /var/lib/postgresql/18/docker; the volume mounts at the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d molecule_studio_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: molecule_studio_postgres18_data
